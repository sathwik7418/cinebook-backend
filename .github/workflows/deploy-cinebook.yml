name: Build CineBook Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test Spring Boot
        run: mvn -B clean verify

      - name: Prepare Docker runtime context
        run: |
          mkdir -p runtime-image
          cp target/cinebook-1.0.0-SNAPSHOT.jar runtime-image/app.jar
          cp Dockerfile.runtime runtime-image/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./runtime-image
          push: true
          tags: |
            ghcr.io/sathwik7418/cinebook-backend:staging
            ghcr.io/sathwik7418/cinebook-backend:${{ github.sha }}

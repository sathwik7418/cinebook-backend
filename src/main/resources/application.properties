spring.application.name=cinebook

server.port=${PORT:8080}

# ============================================================
# JSON-ONLY DATA SOURCE
# ============================================================

# CineBook does not use a relational database.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ============================================================
# Multipart
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# JSON DATA
# ============================================================

# CineBook uses JSON files as its data source.
# No PostgreSQL / JPA / Flyway configuration is required.
cinebook.storage.directory=${CINEBOOK_DATA_DIR:./data}

# CineTickets discovery uses OMDb server-side only. Never expose this key to the frontend.
cinebook.omdb.enabled=${OMDB_ENABLED:false}
cinebook.omdb.api-key=${OMDB_API_KEY:}
cinebook.omdb.base-url=${OMDB_BASE_URL:https://www.omdbapi.com/}
cinebook.omdb.connect-timeout=${OMDB_CONNECT_TIMEOUT:3000}
cinebook.omdb.read-timeout=${OMDB_READ_TIMEOUT:5000}

# CineFeed uses its own opt-in JDBC data source. The JSON-backed application
# store remains the default for authentication, movie catalogue and bookings.
cinebook.social.database.enabled=${CINEBOOK_SOCIAL_DATABASE_ENABLED:false}
cinebook.social.database.url=${CINEBOOK_SOCIAL_DATABASE_URL:jdbc:postgresql://localhost:5432/cinebook_social?currentSchema=cinefeed}
cinebook.social.database.username=${CINEBOOK_SOCIAL_DATABASE_USERNAME:postgres}
cinebook.social.database.password=${CINEBOOK_SOCIAL_DATABASE_PASSWORD:}
# Enable only after the additive CineChat migration has been validated on an isolated Neon branch.
cinebook.chat.enabled=${CINEBOOK_CHAT_ENABLED:false}
cinebook.social.media.directory=${CINEBOOK_SOCIAL_MEDIA_DIRECTORY:./data/cinebook-social-media}


# ============================================================
# Logging
# ============================================================

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.cinebook=INFO


# ============================================================
# Security / JWT
# ============================================================

jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
google.client-id=${GOOGLE_CLIENT_ID:}
google.enabled=${GOOGLE_AUTH_ENABLED:false}
cinebook.email.api-key=${CINEBOOK_EMAIL_API_KEY:}
cinebook.email.from=${CINEBOOK_EMAIL_FROM:}
cinebook.public-url=${CINEBOOK_PUBLIC_URL:http://localhost:5173}


# ============================================================
# CORS
# ============================================================

cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081,https://j-cinebook.netlify.app

cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

cors.allowed-headers=*

cors.exposed-headers=Authorization


# ============================================================
# Application
# ============================================================

app.name=CineBook
app.version=1.0.0

spring.data.jpa.repositories.enabled=false

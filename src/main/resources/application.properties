spring.application.name=cinebook

server.port=${PORT:8080}

# ============================================================
# JSON-ONLY DATA SOURCE
# ============================================================

# CineBook does not use a relational database.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ============================================================
# Multipart
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# JSON DATA
# ============================================================

# CineBook uses JSON files as its data source.
# No PostgreSQL / JPA / Flyway configuration is required.


# ============================================================
# Logging
# ============================================================

logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.cinebook=INFO


# ============================================================
# Security / JWT
# ============================================================

jwt.secret=${JWT_SECRET:cinebook-development-secret-key-please-change-this-32-chars}


# ============================================================
# CORS
# ============================================================

cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081,https://j-cinebook.netlify.app

cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

cors.allowed-headers=*

cors.exposed-headers=Authorization


# ============================================================
# Application
# ============================================================

app.name=CineBook
app.version=1.0.0
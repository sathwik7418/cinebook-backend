spring.application.name=cinebook
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cinebook}
spring.datasource.username=${DATABASE_USERNAME:cinebook}
spring.datasource.password=${DATABASE_PASSWORD:cinebook}
spring.datasource.hikari.maximum-pool-size=10

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cinebook}
spring.flyway.user=${DATABASE_USERNAME:cinebook}
spring.flyway.password=${DATABASE_PASSWORD:cinebook}
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=false

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.com.cinebook=INFO
logging.level.org.hibernate=INFO

# Security
jwt.secret=${JWT_SECRET}

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:8081
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.exposed-headers=Authorization

# Application
app.name=CineBook
app.version=1.0.0
